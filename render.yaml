# Render Blueprint for the live demo (free web service). Render > New > Blueprint, pick this repo.
services:
  - type: web
    name: hawa-kathmandu-air
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-app.txt && python -m hawa download && python -m hawa train --until 2017-12-01
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
